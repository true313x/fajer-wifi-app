name: Build FajerWiFiAudit APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check ZIP
      # =========================================================
      - name: Check ZIP file
        run: |
          echo "===== REPOSITORY ====="
          ls -lah

          echo "===== ZIP FILE ====="

          if [ ! -f "FajerWiFiAudit.zip" ]; then
            echo "ERROR: FajerWiFiAudit.zip was not found!"
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          ls -lh FajerWiFiAudit.zip


      # =========================================================
      # 3. Extract ZIP
      # =========================================================
      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q -o FajerWiFiAudit.zip -d extracted

          echo "===== EXTRACTED PROJECT ====="
          find extracted -maxdepth 4 -type f | head -300


      # =========================================================
      # 4. Find Gradle project automatically
      # =========================================================
      - name: Locate Gradle project
        shell: bash
        run: |

          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo ""
            echo "========================================"
            echo "ERROR: Gradle project not found"
            echo "========================================"
            echo ""

            echo "The ZIP does not contain:"
            echo "settings.gradle"
            echo "or"
            echo "settings.gradle.kts"

            echo ""
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "========================================"
          echo "Gradle project found"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Show project structure
      # =========================================================
      - name: Verify Android project
        run: |

          echo "===== PROJECT DIRECTORY ====="
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "===== PROJECT FILES ====="

          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300


      # =========================================================
      # 6. Setup Java
      # IMPORTANT:
      # No Gradle cache here because project was inside ZIP
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 7. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 8. Accept Android SDK licenses
      # =========================================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # =========================================================
      # 9. Build APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          echo "========================================"
          echo "BUILDING ANDROID APK"
          echo "========================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -lah

          # -----------------------------------------
          # Use Gradle Wrapper if project contains it
          # -----------------------------------------

          if [ -f "./gradlew" ]; then

            echo ""
            echo "Gradle Wrapper detected."

            chmod +x ./gradlew

            ./gradlew assembleDebug --stacktrace

          else

            echo ""
            echo "Gradle Wrapper NOT FOUND."
            echo "Installing Gradle 8.14.5..."

            cd /tmp

            wget -q \
              https://services.gradle.org/distributions/gradle-8.14.5-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            export PATH="/tmp/gradle-8.14.5/bin:$PATH"

            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

            gradle assembleDebug --stacktrace

          fi


      # =========================================================
      # 10. Find APK
      # =========================================================
      - name: Find generated APK
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # =========================================================
      # 11. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FajerWiFiAudit-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
