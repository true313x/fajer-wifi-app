name: Build FajerWiFiAudit APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # 2. Check ZIP
      # =========================================================
      - name: Check ZIP file
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          ls -lah

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ZIP"
          echo "========================================"

          ZIP_FILE=""

          if [ -f "FajerWiFiAudit.zip" ]; then
            ZIP_FILE="FajerWiFiAudit.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              \( -iname "*.zip" \) \
              | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 3. Extract ZIP
      # =========================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED CONTENTS"
          echo "========================================"

          find extracted -maxdepth 5 -type f -print | head -500


      # =========================================================
      # 4. Locate Gradle project
      # =========================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "========================================"

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1 || true)

          if [ -z "$SETTINGS_FILE" ]; then

            echo ""
            echo "ERROR: Gradle project not found."
            echo ""
            echo "Searching for Gradle files..."
            find extracted -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "gradlew" \
                -o \
                -name "gradle-wrapper.properties" \
              \) \
              -print

            echo ""
            echo "Complete ZIP structure:"
            find extracted -maxdepth 8 -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "========================================"
          echo "GRADLE PROJECT FOUND"
          echo "========================================"

          echo "Settings:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Verify Android project
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROJECT DIRECTORY"
          echo "========================================"

          ls -lah "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "GRADLE FILES"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print


      # =========================================================
      # 6. Setup Java
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 7. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 8. Accept Android SDK licenses
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # =========================================================
      # 9. Prepare Gradle
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING GRADLE"
          echo "========================================"

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper detected."

            chmod +x ./gradlew

            echo ""
            echo "Gradle Wrapper version:"
            ./gradlew --version

          else

            echo "Gradle Wrapper NOT FOUND."

            echo "Creating Gradle installation..."

            cd /tmp

            wget -q \
              https://services.gradle.org/distributions/gradle-8.14.5-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            export PATH="/tmp/gradle-8.14.5/bin:$PATH"

            echo "GRADLE_HOME=/tmp/gradle-8.14.5" >> "$GITHUB_ENV"
            echo "/tmp/gradle-8.14.5/bin" >> "$GITHUB_PATH"

            echo ""
            echo "Installed Gradle:"
            gradle --version

          fi


      # =========================================================
      # 10. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FAJER WIFI AUDIT APK"
          echo "========================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "========================================"
          echo "RUNNING GRADLE BUILD"
          echo "========================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --stacktrace \
              --no-daemon

          else

            gradle \
              assembleDebug \
              --stacktrace \
              --no-daemon

          fi


      # =========================================================
      # 11. Find generated APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "========================================"

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directories:"
            find "$PROJECT_DIR" \
              -type d \
              -name "build" \
              -print

            exit 1
          fi

          echo ""
          echo "Generated APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # =========================================================
      # 12. Upload APK
      # =========================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FajerWiFiAudit-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
